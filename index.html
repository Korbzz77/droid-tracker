const RAR_ORDER=["common","rare","epic","legendary","mythic","iconic"];
/* the fusion rarity colours, plus the one rarity fusion never has to name */
const RARC=Object.assign({iconic:"#3ad6c0"},FRC);

/* A droid at seven qualities is a matrix, so lay it out as one: a row per droid, a column
   per quality. A wrapping grid split a droid's set across two rows and gave no way to scan a
   single quality down the page.

   Note this does not track Flawless. Flawless is a random roll on any craft rather than
   something earned by completing a set, so it cannot be derived from what is ticked here. */
function idxDroids(){
  const by={};
  indexEntries().forEach(e=>{
    (by[e.n]=by[e.n]||{n:e.n,cls:e.cls,rar:e.rar,qs:[]}).qs.push(e.q);
  });
  return Object.values(by);
}

function viewIndex(){
  const all=indexEntries();
  const droids=idxDroids();
  const q=idxQ.trim().toUpperCase();

  const rowDone=d=>d.qs.filter(x=>craftedHas(d.n,x)).length;
  const complete=d=>rowDone(d)===d.qs.length;
  const visible=droids.filter(d=>
    (idxCls==="all"||d.cls===idxCls) &&
    (!q||d.n.indexOf(q)>-1) &&
    (!idxHideDone||!complete(d)));

  const total=all.length, done=all.filter(e=>craftedHas(e.n,e.q)).length;
  const pct=Math.round(done/total*100);
  const sets=droids.filter(complete).length;
  const flawAble=droids.filter(d=>d.qs.length===TIERS.length);
  const flawTotal=flawAble.length, flawDone=flawAble.filter(d=>isFlaw(d.n)).length;

  const left=f=>all.filter(e=>!craftedHas(e.n,e.q)&&(!q||e.n.indexOf(q)>-1)&&f(e)).length;
  const nCls=v=>left(e=>v==="all"||e.cls===v);

  const CLS_MARK={worker:"W",astromech:"A",battle:"B"};
  const row=d=>`<div class="xr ${complete(d)?"whole":""} ${isFlaw(d.n)?"flaw":""}"
      style="--sd:-${([...d.n].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%53)/10}s">
      <div class="xn"><span class="xcls xcls-${d.cls}">${CLS_MARK[d.cls]||"?"}</span><span class="xnm">${d.n}</span></div>
      ${TIERS.map(qq=>{
        const st=`--tq:${TC[qq]};--tqf:${TXT[qq]}`;
        if(d.qs.indexOf(qq)<0) return `<div class="xc none" style="${st}">&middot;</div>`;
        const got=craftedHas(d.n,qq);
        return `<button class="xc ${got?"got":""}" data-x="${d.n.replace(/"/g,"&quot;")}|${qq}"
          style="${st}" aria-label="${d.n} ${ABBR[qq]}"></button>`;
      }).join("")}
      <div class="xf ${d.qs.length-rowDone(d)===1?"close":""}">${rowDone(d)}/${d.qs.length}</div>
      ${d.qs.length<TIERS.length
        ? `<div class="xw none">&middot;</div>`
        : `<button class="xw ${isFlaw(d.n)?"got":""}" data-xw="${d.n.replace(/"/g,"&quot;")}"
            aria-pressed="${isFlaw(d.n)}" aria-label="${d.n} flawless"><span class="xws">&#10038;</span></button>`}
    </div>`;

  let body="";
  RAR_ORDER.forEach(r=>{
    const inRar=visible.filter(d=>d.rar===r);
    if(!inRar.length) return;
    const cd=inRar.reduce((a,d)=>a+rowDone(d),0), ct=inRar.reduce((a,d)=>a+d.qs.length,0);
    /* a search that matched inside a rolled up band would otherwise show a heading with
       nothing under it, so searching opens everything for as long as the query lasts */
    const shut=!q && idxClosed.has(r);
    body+=`<button class="xgroup ${shut?"shut":""}" data-xg="${r}" style="--fr:${RARC[r]}"
      aria-expanded="${!shut}"><svg class="ic xchev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8 10 12 14 8"/></svg>${r}
      <b>${inRar.length}</b><span class="${ct-cd?"":"done"}">${ct-cd?(ct-cd)+" left":"complete"}</span></button>`;
    if(!shut) body+=inRar.map(row).join("");
  });

  document.getElementById("v-index").innerHTML=`
    <h2>Droidex</h2>
    <div class="sub">Every droid at every quality, and whether you have ever crafted it. A
      diamond does not count as a gold here, and selling never removes anything. Every number
      on a filter is how many you still need. The sparkle at the end of a row is flawless,
      which the game counts once per droid rather than once per quality.</div>

    <div class="xhead">
      <div class="xstats">
        <div><div class="xbig">${done}<span>/${total}</span></div>
          <div class="mini">crafted &middot; ${pct}%</div></div>
        <div><div class="xbig">${sets}<span>/${droids.length}</span></div>
          <div class="mini">droids finished at every quality</div></div>
        <div><div class="xbig ${flawDone?"flaw":""}">${flawDone}<span>/${flawTotal}</span></div>
          <div class="mini">flawless</div></div>
      </div>
      <div class="xbar"><i style="width:${pct}%"></i></div>
    </div>

    <div class="btools">
      <div class="searchwrap">
        <span class="si"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.1"/><path d="M12.4 12.4 16.8 16.8"/></svg></span>
        <input class="search" id="xsearch" type="search" inputmode="search"
          placeholder="Find a droid" value="${idxQ.replace(/"/g,"&quot;")}"
          autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <button class="searchclr ${idxQ?"on":""}" id="xclear" aria-label="Clear search">&times;</button>
      </div>
      <div class="chips">${["all","worker","astromech","battle"].map(v=>
        `<div class="chip ${idxCls===v?"on":""} ${nCls(v)?"":"done"}" data-xc="${v}">${CLS_LABEL[v]}<b>${nCls(v)}</b></div>`).join("")}
        <div class="chip ${idxHideDone?"on":""}" id="xhide">Hide finished</div>
        <div class="chip ${idxGaps?"on":""}" id="xgap">Show gaps</div></div>
    </div>

    ${visible.length?`
      <div class="xtable ${idxGaps?"gaps":""}" style="--cols:${TIERS.length}">
        <div class="xr xhdr">
          <div class="xn">Droid</div>
          ${TIERS.map(qq=>`<div class="xc lbl" style="--tqf:${TXT[qq]};color:${TXT[qq]}">${ABBR[qq]}</div>`).join("")}
          <div class="xf lbl">Set</div>
          <div class="xw lbl">&#10038;</div>
        </div>
        ${body}
      </div>`
      :`<div class="empty">No droid matches those filters.</div>`}`;

  const si=document.getElementById("xsearch");
  if(si) si.oninput=e=>{
    const pos=e.target.selectionStart;
    idxQ=e.target.value; viewIndex();
    const n=document.getElementById("xsearch");
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos) }catch(err){} }
  };
  const cb=document.getElementById("xclear");
  if(cb) cb.onclick=()=>{ idxQ=""; viewIndex();
    const n=document.getElementById("xsearch"); if(n) n.focus(); };
  const hb=document.getElementById("xhide");
  if(hb) hb.onclick=()=>{ idxHideDone=!idxHideDone; viewIndex(); };
  const gb=document.getElementById("xgap");
  if(gb) gb.onclick=()=>{ idxGaps=!idxGaps; viewIndex(); };
}

/* ---- settings and reset ---- */
function cycleStats(c){
  const rbs=DATA[c].rebirths;
  const req=new Set(rbs.flatMap(r=>r.reqs.map(x=>x[0]+"|"+x[1])));
  let m=0;
  req.forEach(k=>{const s=splitKey(k); if(s&&has(s[0],s[1])) m++});
  return {total:req.size,made:m,level:store.get("dt_level_"+c,0)};
}
/* Droids are shared across cycles now, so resetting a cycle can only mean its rebirth
   level. Wiping what you own is a separate, clearly labelled thing. */
function resetCycleLevel(c){
  store.set("dt_level_"+c,0);
  if(c===cycle) level=0;
}
function resetEverything(){
  owned={}; level=0;
  crafted=new Set(); store.set("dt_crafted",[]);
  [1,2,3,4,5].forEach(c=>store.set("dt_level_"+c,0));
  save();
}

/* ---- backup ----
   Progress lives in localStorage, which goes away if the home screen app is deleted.
   These give you a copy you actually own. */
function exportData(){
  const levels={};
  [1,2,3,4,5].forEach(c=>levels[c]=store.get("dt_level_"+c,0));
  return JSON.stringify({app:"droid-tycoon-tracker",v:4,
    exported:new Date().toISOString(),cycle,owned,levels,
    crafted:[...crafted],flawless:[...flawless]});
}
function backupName(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `droid-tracker-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}
async function saveBackup(){
  const text=exportData(), name=backupName();
  /* iOS standalone web apps do a poor job with <a download>, so prefer the share sheet:
     it lands in Files, Notes, iCloud or AirDrop, whichever you like. */
  try{
    const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Droid Tracker backup"});
      return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function copyBackup(){
  const text=exportData();
  try{
    await navigator.clipboard.writeText(text);
    alert("Backup copied to the clipboard.\n\nPaste it somewhere you will still have later, a note to yourself works fine.");
  }catch(e){
    prompt("Copy this text and keep it somewhere safe:",text);
  }
}
function applyBackup(text){
  let d;
  try{ d=JSON.parse(text) }catch(e){ alert("That file is not readable as a backup."); return false }
  if(!d||d.app!=="droid-tycoon-tracker"){
    alert("That is not a Droid Tycoon Tracker backup."); return false }
  const newOwned={}, newLevels={};
  if(d.owned&&typeof d.owned==="object"){
    Object.keys(d.owned).forEach(nm=>{ if(TIERS.indexOf(d.owned[nm])>-1) newOwned[nm]=d.owned[nm] });
    [1,2,3,4,5].forEach(c=>newLevels[c]=Number((d.levels||{})[c])||0);
  } else if(d.cycles){
    /* a backup from before droids were shared across cycles: fold it in the same way */
    [1,2,3,4,5].forEach(c=>{
      const e=d.cycles[c]||{};
      newLevels[c]=Number(e.level)||0;
      (Array.isArray(e.made)?e.made:[]).forEach(k=>{
        const s=splitKey(k); if(!s) return;
        const nm=s[0], t=s[1]; if(TIERS.indexOf(t)<0) return;
        if(!newOwned[nm]||TIERS.indexOf(t)>TIERS.indexOf(newOwned[nm])) newOwned[nm]=t;
      });
    });
  } else { alert("That is not a Droid Tycoon Tracker backup."); return false }
  const n=Object.keys(newOwned).length;
  const when=(d.exported||"").slice(0,10);
  if(!confirm(`Restore ${n} droids${when?" from "+when:""}?\n\nThis replaces everything currently saved on this device.`)) return false;
  owned=newOwned;
  if(Array.isArray(d.crafted)){ crafted=new Set(d.crafted); store.set("dt_crafted",d.crafted); }
  /* a v3 backup predates flawless, so leave what is on the device rather than wiping it */
  if(Array.isArray(d.flawless)){ flawless=new Set(d.flawless); store.set("dt_flawless",d.flawless); }
  [1,2,3,4,5].forEach(c=>store.set("dt_level_"+c,newLevels[c]||0));
  cycle=Number(d.cycle)||1;
  level=newLevels[cycle]||0;
  save();
  return true;
}
function afterRestore(){
  document.getElementById("cycleSel").value=cycle;
  applyTheme(); buildLvlSel(); render();
  alert("Restored.");
}
function loadBackup(){
  const i=document.createElement("input");
  i.type="file"; i.accept="application/json,.json";
  i.onchange=()=>{
    const f=i.files&&i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ if(applyBackup(String(r.result))) afterRestore() };
    r.onerror=()=>alert("Could not read that file.");
    r.readAsText(f);
  };
  i.click();
}

      </div>

    </div>`;
  const fb=document.getElementById("fillBtn");
  if(fb) fb.onclick=()=>{

      "Undo",()=>{ owned=prev; save(); render() });

    if(kind==="cycle") resetCycleLevel(cycle); else resetEverything();

  document.getElementById("closeSet").onclick=()=>{settingsOpen=false;pending=null;render()};
}

function render(){
  /* Measured here as well as from the observer: the sticky filter bar reads --hh, and a
     wrong value parks it away from the header edge. render() runs on every view and state
     change, and the cost is one offsetHeight read. */
  syncHeaderH();
  ["all","build","sell","fuse","index"].forEach(v=>document.getElementById("v-"+v).classList.toggle("hide",v!==view));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="all")viewAll(); if(view==="build")viewBuild();
  if(view==="sell")viewSell(); if(view==="fuse")viewFuse();
  if(view==="index")viewIndex();
  renderSettings();
}

document.body.addEventListener("click",e=>{
  const bpb=e.target.closest("[data-bp]");
  if(bpb){ toggleAlert(bpb.dataset.bp); return }
  const qb=e.target.closest(".qbtn");
  if(qb){ e.stopPropagation(); openSheet(qb.dataset.q); return }
  const req=e.target.closest(".req");
  if(req){
    const s=splitKey(req.dataset.k);
    if(s){
      const n=s[0], t=s[1], i=TIERS.indexOf(t);
      /* One droid, one quality. Ticking means you own at least this much; unticking means
         you own less than this, so drop to the quality just below rather than to nothing. */
      setOwned(n, has(n,t) ? (i>0?TIERS[i-1]:null) : t);
      render();
    }
    return}
  const xc=e.target.closest("[data-x]");
  if(xc){
    const i=xc.dataset.x.lastIndexOf("|");
    const n=xc.dataset.x.slice(0,i), qq=xc.dataset.x.slice(i+1);
    markCrafted(n,qq,!craftedHas(n,qq));
    viewIndex(); return}
  const xw=e.target.closest("[data-xw]");
  if(xw){ toggleFlaw(xw.dataset.xw); viewIndex(); return}
  const xg=e.target.closest("[data-xg]");
  if(xg){ toggleGroup(xg.dataset.xg); viewIndex(); return}
  const xcl=e.target.closest("[data-xc]");

  const la=e.target.closest("[data-la]");
  if(la){lookahead=+la.dataset.la; render(); return}
  const sell=e.target.closest("[data-sell]");
  if(sell){
    const n=sell.dataset.sell, prev=owned[n], f=futureNeeds(n);
    setOwned(n,null); render();
    const warn=f.length ? ` Cycle ${cycle} wants it again at rebirth ${f[0].lvl}.` : "";
    toast(`${n} sold.${warn}`,"Undo",()=>{ setOwned(n,prev); render() });
    return}
});

  if(level>0 && Object.keys(owned).length===0){

/* the sticky filter bar sits directly under the header, whose height moves with the
   safe-area inset and on rotation, so measure it rather than hard-coding a number */
function syncHeaderH(){
  const h=document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");
}
/* Watch the element rather than the window. The header grows a second row when the
   blueprint chips wrap on a narrow screen, and it can also change after fonts load, neither
   of which fires a resize. A stale --hh pins the sticky filter bar at the wrong offset. */
if(window.ResizeObserver){
  const hEl=document.querySelector("header");
  if(hEl) new ResizeObserver(syncHeaderH).observe(hEl);
}
addEventListener("resize",syncHeaderH);
addEventListener("orientationchange",()=>setTimeout(syncHeaderH,250));

applyTheme(); buildLvlSel(); paintBlueprintChips(); render(); tickBlueprints(); syncHeaderH();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  /* Registering alone was not enough: a home screen app that iOS keeps suspended can go on
     showing an old build for days. Check for an update on every launch, and when a new
     worker takes over, reload once so the new version is actually what you are looking at.
     hadController keeps the very first install from reloading needlessly. */
  const hadController=!!navigator.serviceWorker.controller;
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController||refreshing) return;
    refreshing=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .then(reg=>{ reg.update(); setInterval(()=>reg.update(),60*60*1000); })
      .catch(()=>{});
  });
}
